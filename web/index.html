<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B3 Stock Analyzer (IA)</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <h1>Análise de Ações da B3 com IA</h1>
      <p>Ganhe dinheiro com oportunidades na B3 (Powered by Ollama + Yahoo Finance)</p>

      <div class="card">
        <form id="analyze-form">
          <input type="text" id="ticker-input" placeholder="Ex: PETR4.SA, VALE3.SA, ITUB4.SA" required />
          <button type="submit" id="analyze-btn">Analisar Ação Única</button>
        </form>
        <hr style="margin: 20px 0; border: 1px solid #333;" />

        <form id="portfolio-form" style="margin-bottom: 20px;">
          <h3>Personalizar Portfólio</h3>
          <div style="margin-bottom: 10px;">
            <label for="risk-tolerance">Tolerância ao Risco:</label>
            <select id="risk-tolerance" style="width: 100%; padding: 8px; margin-top: 5px;">
              <option value="Baixo">Baixo (Conservador)</option>
              <option value="Médio" selected>Médio (Moderado)</option>
              <option value="Alto">Alto (Agressivo)</option>
            </select>
          </div>
          <div style="margin-bottom: 10px;">
            <label for="sector-preferences">Setores de Preferência (Opcional):</label>
            <input type="text" id="sector-preferences" placeholder="Ex: Tecnologia, Energia, Financeiro" style="width: 100%; padding: 8px; margin-top: 5px;" />
          </div>
          <button type="submit" id="generate-portfolio-btn" style="width: 100%;">Gerar Portfólio Recomendado</button>
        </form>
      </div>

      <div id="loading" class="hidden">
        <p>Analisando dados com IA... isso pode levar alguns segundos.</p>
      </div>

      <div id="result" class="hidden">
        <h2>Resultado para <span id="res-ticker"></span></h2>
        <div class="stats">
          <p><strong>Preço:</strong> <span id="res-price"></span></p>
          <p><strong>Variação:</strong> <span id="res-change"></span>%</p>
        </div>
        <div class="analysis-box">
          <h3>Recomendação da IA:</h3>
          <p id="res-analysis"></p>
        </div>
      </div>

      <div id="portfolio-result" class="hidden">
        <h2>Portfólio Recomendado</h2>
        <div class="stats" id="portfolio-stats">
        </div>
        <div class="analysis-box">
          <h3>Estratégia do Gestor IA:</h3>
          <p id="portfolio-analysis"></p>
        </div>
      </div>

      <div id="error" class="hidden error">
      </div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
