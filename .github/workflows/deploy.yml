name: Deploy

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build and Push to GHCR
        uses: juninmd/base-actions/docker-build-push@main
        with:
          image-name: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  trainer:
    name: Build and Push Trainer Image
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # A imagem final e a do bun e nao carrega numpy/pandas/xgboost. O estagio
      # `trainer` do Dockerfile ja tem tudo, mas o BuildKit nunca o construia
      # porque o estagio final nao depende dele -- entao o CronJob de treino
      # quebrava em runtime com ModuleNotFoundError. Aqui ele vira uma imagem
      # propria, mantendo a imagem da aplicacao sem as dependencias de ML.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: trainer
          push: true
          tags: ghcr.io/${{ github.repository }}-trainer:latest
          cache-from: type=gha,scope=trainer
          cache-to: type=gha,mode=max,scope=trainer
